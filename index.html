<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxora - AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#050816;--s1:rgba(17,23,46,.62);--s2:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#e8ecf8;--mu:#8b94b3;--grid:rgba(255,255,255,.07);--sh:0 24px 60px -26px rgba(0,0,0,.85);--a:#22d3ee;--b:#a78bfa;--ad:color-mix(in srgb,var(--a) 55%,#000);--ag:color-mix(in srgb,var(--a) 50%,transparent)}
[data-mode=light]{--bg:#e9eefa;--s1:rgba(255,255,255,.74);--s2:rgba(15,23,42,.05);--bd:rgba(15,23,42,.1);--tx:#0f172a;--mu:#5b6685;--grid:rgba(15,23,42,.08);--sh:0 24px 50px -28px rgba(30,41,90,.4)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--tx);font:400 14.5px/1.6 "Plus Jakarta Sans","Noto Naskh Arabic",system-ui,sans-serif;transition:background .5s,color .4s;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:48vmax;height:48vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 18s ease-in-out infinite alternate}
.b1{background:var(--a);top:-18vmax;left:-12vmax}.b2{background:var(--b);bottom:-20vmax;right:-14vmax;animation-delay:-9s}
[data-mode=light] .blob{opacity:.22}
.floor{position:absolute;left:-50%;right:-50%;bottom:-8%;height:55%;background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;transform:perspective(520px) rotateX(63deg);-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 78%);mask-image:linear-gradient(to top,#000 5%,transparent 78%);animation:grid 5s linear infinite}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}@keyframes grid{to{background-position:0 56px}}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:var(--s1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--bd);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:12px}
.cw{width:38px;height:38px;display:grid;place-items:center;perspective:220px}
.cube{width:22px;height:22px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
.cube i{position:absolute;inset:0;border-radius:4px;border:1px solid rgba(255,255,255,.55);background:linear-gradient(135deg,var(--a),var(--b));opacity:.92}
.cube i:nth-child(1){transform:translateZ(11px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(11px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(11px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(11px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(11px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(11px)}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
h1{font:800 20px/1 Sora,sans-serif;background:linear-gradient(90deg,var(--tx),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.st{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:6px;margin-top:4px}
.st b{width:7px;height:7px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #10b98188}70%{box-shadow:0 0 0 7px transparent}}
.tools{display:flex;gap:8px;align-items:center;position:relative}
.ib{height:38px;min-width:38px;padding:0 12px;border-radius:12px;background:var(--s2);border:1px solid var(--bd);color:var(--tx);font:500 12.5px "Plus Jakarta Sans",sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.ib:hover{transform:translateY(-2px);border-color:var(--a)}.ib:active{transform:translateY(1px)}
select.ib{appearance:none;padding:0 10px;max-width:150px}select.ib option{color:#111}
#tm{position:absolute;right:0;top:48px;width:236px;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:10px;border-radius:18px;background:var(--s1);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--bd);box-shadow:var(--sh);opacity:0;visibility:hidden;transform:perspective(500px) rotateX(-12deg) translateY(-8px);transform-origin:top;transition:.25s cubic-bezier(.2,.8,.2,1)}
#tm.open{opacity:1;visibility:visible;transform:none}
#tm button{display:flex;align-items:center;gap:8px;padding:8px;border:0;border-radius:10px;background:transparent;color:var(--tx);font:500 12px "Plus Jakarta Sans",sans-serif;cursor:pointer}
#tm button:hover,#tm button.on{background:var(--s2)}#tm i{width:14px;height:14px;border-radius:50%}
.wrap{flex:1;display:flex;min-height:0}
aside{width:268px;flex:none;display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--s1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--bd);transition:margin .35s cubic-bezier(.2,.8,.2,1),transform .35s cubic-bezier(.2,.8,.2,1);z-index:25}
body.col aside{margin-left:-268px}
.newc{height:44px;border:0;border-radius:14px;color:#fff;font:600 13.5px "Plus Jakarta Sans",sans-serif;background:linear-gradient(145deg,var(--b),var(--a));box-shadow:0 4px 0 var(--ad),0 14px 24px -10px var(--ag);cursor:pointer;transition:transform .12s,box-shadow .12s}
.newc:hover{transform:translateY(-2px)}.newc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ad)}
#hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin}
.hi{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:11px;cursor:pointer;font-size:13px;color:var(--mu);transition:background .2s,color .2s}
.hi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hi:hover,.hi.on{background:var(--s2);color:var(--tx)}
.hi button{background:none;border:0;color:var(--mu);cursor:pointer;opacity:0}.hi:hover button{opacity:1}
.acct{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--s2);border:1px solid var(--bd);font-size:12.5px}
.acct .pic{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;font-weight:700;flex:none;background-size:cover}
.acct .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{background:none;border:0;color:var(--a);cursor:pointer;font:600 12px inherit;font-family:inherit}
.col2{flex:1;display:flex;flex-direction:column;min-width:0}
main{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:18px;max-width:880px;width:100%;margin:0 auto;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
#welcome{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;padding:10px}
.stage{width:150px;height:150px;position:relative;margin-bottom:34px;perspective:700px;transform-style:preserve-3d;transform:rotateX(calc(var(--my,0)*-12deg)) rotateY(calc(var(--mx,0)*14deg));transition:transform .25s ease-out}
.orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),transparent 24%),radial-gradient(circle at 72% 80%,var(--b),transparent 60%),radial-gradient(circle,var(--a),var(--ad));box-shadow:inset -16px -20px 42px rgba(0,0,0,.45),0 34px 70px -14px var(--ag);animation:float 5s ease-in-out infinite}
.ring{position:absolute;inset:-28px;border-radius:50%;border:2px solid var(--b);opacity:.55;transform:rotateX(74deg);animation:rs 8s linear infinite}
.ring.r2{inset:-48px;border-color:var(--a);opacity:.28;animation-duration:13s;animation-direction:reverse}
.shadow{position:absolute;left:18%;right:18%;bottom:-30px;height:16px;border-radius:50%;background:#000;opacity:.35;filter:blur(10px);animation:sh 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}@keyframes rs{to{transform:rotateX(74deg) rotateZ(360deg)}}@keyframes sh{50%{transform:scale(.8);opacity:.2}}
#welcome h2{font:800 clamp(30px,6vw,46px)/1.1 Sora,sans-serif;background:linear-gradient(90deg,var(--tx),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
#welcome p{max-width:480px;color:var(--mu);margin:12px 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 15px;border-radius:13px;background:var(--s1);border:1px solid var(--bd);color:var(--tx);font:500 13px "Plus Jakarta Sans",sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--bd);transition:transform .15s,box-shadow .15s,border-color .2s}
.chip:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--bd);border-color:var(--a)}.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.m{display:flex;gap:12px;align-items:flex-start;animation:pop .55s cubic-bezier(.2,.8,.2,1) both}.m.u{justify-content:flex-end}
@keyframes pop{from{opacity:0;transform:perspective(700px) rotateX(14deg) translateY(18px) scale(.97)}}
.av{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 26%,#fff9,transparent 30%),radial-gradient(circle at 70% 80%,var(--b),transparent 60%),var(--a);box-shadow:inset -4px -5px 10px #0005,0 8px 18px -6px var(--ag)}
.bub{padding:13px 16px;border-radius:18px;max-width:min(690px,88%);min-width:0;background:var(--s1);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .3s}
.bub:hover{transform:translateY(-2px)}
.u .bub{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:0;box-shadow:0 16px 32px -14px var(--ag),inset 0 1px 0 rgba(255,255,255,.4)}
.msg-body{word-break:break-word}.meta{margin-top:8px;font-size:10.5px;color:var(--mu)}.meta:empty{display:none}
.fc{display:inline-flex;gap:6px;align-items:center;margin:0 6px 6px 0;padding:3px 10px;border-radius:999px;font-size:11.5px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25)}
.bub img.gen,.bub img.th{display:block;max-width:100%;border-radius:12px;margin:8px 0;box-shadow:0 14px 30px -14px #000a}.bub img.th{max-height:150px}
.dl{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--a);text-decoration:none;margin-top:2px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:var(--a);animation:bn 1.2s infinite ease-in-out}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
.streaming::after{content:"▋";margin-left:2px;color:var(--a);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.code-block{margin:9px 0;border-radius:12px;overflow:hidden;border:1px solid #1e2742;background:#070b1c;color:#e2e8f0}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#0d1330;font-size:11px;color:#94a3b8}
.copy-btn{background:transparent;border:1px solid #334155;color:#cbd5e1;border-radius:8px;padding:2px 9px;font-size:11px;cursor:pointer}.copy-btn:hover{border-color:var(--a)}
.code-block pre{margin:0;padding:12px;overflow-x:auto;font-size:12.5px;line-height:1.55}.code-block code{font-family:ui-monospace,Menlo,Consolas,monospace}
.inline-code{background:var(--s2);border:1px solid var(--bd);padding:1px 6px;border-radius:6px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
footer{padding:8px 16px 14px;position:relative;z-index:10}
#pf{display:flex;flex-wrap:wrap;gap:6px;max-width:820px;margin:0 auto 8px}
#pf .fc{background:var(--s1);border-color:var(--bd);color:var(--tx);margin:0}#pf .fc button{background:none;border:0;color:var(--mu);cursor:pointer}
.bar{display:flex;align-items:flex-end;gap:6px;max-width:820px;margin:0 auto;padding:8px;border-radius:22px;background:var(--s1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.08);transition:border-color .3s,box-shadow .3s}
.bar:focus-within{border-color:var(--a);box-shadow:var(--sh),0 0 0 4px var(--ag)}
.tg{width:40px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--mu);cursor:pointer;transition:color .2s,background .2s,transform .15s}
.tg:hover{color:var(--tx);background:var(--s2)}.tg.on{color:var(--a);background:var(--s2);box-shadow:inset 0 0 0 1px var(--a)}.tg:active{transform:scale(.92)}
textarea{flex:1;background:transparent;border:0;outline:0;resize:none;color:var(--tx);font:inherit;padding:10px 8px;max-height:130px}textarea::placeholder{color:var(--mu)}
.send{width:44px;height:44px;border-radius:14px;border:0;color:#fff;background:linear-gradient(145deg,var(--b),var(--a));box-shadow:0 4px 0 var(--ad),0 14px 24px -8px var(--ag);cursor:pointer;transition:transform .12s,box-shadow .12s}
.send:hover{transform:translateY(-2px)}.send:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ad),0 5px 10px -6px var(--ag)}
.sig{display:flex;justify-content:center;margin-top:12px}
.pill{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:12px;color:var(--mu);border:1px solid transparent;background:linear-gradient(var(--bg),var(--bg)) padding-box,linear-gradient(90deg,var(--a),var(--b),var(--a)) border-box;background-size:auto,200% 100%;animation:bd 6s linear infinite;transition:transform .3s,box-shadow .3s}
.pill:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 30px -14px var(--ag)}
.nm{font:700 13px Sora,sans-serif;background:linear-gradient(90deg,var(--a),var(--b),var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nm 4s linear infinite}
.role{padding:2px 10px;border-radius:999px;background:var(--s2);border:1px solid var(--bd);color:var(--tx);font-size:11px;display:inline-flex;gap:6px;align-items:center}
@keyframes bd{to{background-position:0 0,200% 0}}@keyframes nm{to{background-position:200% 0}}
#ov{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(2,4,14,.6);backdrop-filter:blur(8px);padding:16px}#ov.open{display:grid}
.md{width:min(400px,100%);max-height:86vh;overflow:auto;padding:26px;border-radius:24px;background:var(--bg);border:1px solid var(--bd);box-shadow:var(--sh);animation:pop .45s cubic-bezier(.2,.8,.2,1) both;text-align:center}
.md h3{font:800 22px Sora,sans-serif;margin-bottom:6px}.md p{color:var(--mu);font-size:13px;margin-bottom:16px}
.md .chip{display:block;width:100%;margin-bottom:10px}.md .mi{display:flex;gap:8px;text-align:left;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}.md .mi span{flex:1}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);padding:10px 16px;border-radius:12px;background:var(--s1);backdrop-filter:blur(16px);border:1px solid var(--a);box-shadow:var(--sh);font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:70;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translateX(-50%)}
.src{margin-top:10px;font-size:12px;color:var(--mu)}.src a{color:var(--a);margin-right:10px;text-decoration:none}
.inp{width:100%;padding:11px 13px;margin-bottom:10px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);font:inherit;font-size:13px;outline:0}.inp:focus{border-color:var(--a)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
@media(max-width:800px){.hide{display:none}header{padding:10px 12px}aside{position:fixed;left:0;top:0;bottom:0;margin-left:0!important;transform:translateX(-100%);background:var(--bg);width:min(290px,86vw)}body.sb aside{transform:none}}
@media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><div class="floor"></div></div>
<header>
  <div class="brand">
    <button class="ib" aria-label="Toggle sidebar" onclick="toggleSide()"><i class="fa-solid fa-bars-staggered"></i></button>
    <div class="cw"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div><h1>Voxora</h1><div class="st"><b></b><span id="model-label">Voxora</span> • Live streaming • Multilingual</div></div>
  </div>
  <div class="tools">
    <select id="model-select" class="ib" aria-label="Model" onchange="onModelChange(this.value)">
      <option value="gemini-3.5-flash-lite">⚡ Voxora Turbo</option>
      <option value="gemini-3.5-flash">Voxora Pro</option>
      <option value="auto">Auto-detect</option>
    </select>
    <button class="ib" aria-label="Themes" onclick="toggleThemeMenu(event)"><i class="fa-solid fa-palette" style="color:var(--a)"></i><span class="hide">Themes</span></button>
    <button class="ib" aria-label="Dark or light mode" onclick="toggleMode()"><i id="mi" class="fa-solid fa-moon"></i></button>
    <div id="tm"></div>
  </div>
</header>
<div class="wrap">
<aside>
  <button class="newc" onclick="newChat();closeSideMobile()"><i class="fa-solid fa-plus"></i> New chat</button>
  <div id="hist"></div>
  <button class="ib" onclick="showMem()" style="justify-content:flex-start"><i class="fa-solid fa-brain" style="color:var(--a)"></i> Memory <span id="mc" style="margin-left:auto;color:var(--mu)">0</span></button>
  <div class="acct"><div class="pic" id="pic">G</div><div class="nm2" id="an">Guest</div><button class="lk" id="ab" onclick="acctBtn()">Sign in</button></div>
</aside>
<div class="col2">
<main id="chat-container">
  <section id="welcome">
    <div class="stage"><div class="ring r2"></div><div class="ring"></div><div class="orb"></div><div class="shadow"></div></div>
    <h2>Voxora</h2>
    <p>Hello! I'm Voxora. Ask me anything, chat in any language, upload a file or photo, or ask me to create an image.</p>
    <div class="chips">
      <button class="chip" onclick="quickAsk(this.textContent)">Explain Docker in simple words</button>
      <button class="chip" onclick="quickAsk(this.textContent)">Write a Python REST API example</button>
      <button class="chip" onclick="quickAsk(this.textContent)">Create an image of a futuristic city at sunset</button>
      <button class="chip" onclick="quickAsk(this.textContent)">Translate to Urdu: Good morning</button>
    </div>
  </section>
</main>
<footer>
  <div id="pf"></div>
  <div class="bar">
    <input type="file" id="fi" multiple hidden accept="image/*,application/pdf,text/*,.txt,.md,.csv,.json,.py,.js,.html,.yml,.yaml,.tf,.sh,.log,.xml">
    <button class="tg" id="att" aria-label="Attach a file or photo" title="Attach a file or photo" onclick="document.getElementById('fi').click()"><i class="fa-solid fa-paperclip"></i></button>
    <button class="tg" id="imb" aria-label="Create image mode" title="Create image mode" onclick="toggleImg()"><i class="fa-solid fa-image"></i></button>
    <textarea id="user-input" rows="1" dir="auto" placeholder="Ask anything from Voxora..."></textarea>
    <button id="send-btn" class="send" aria-label="Send" onclick="onSendClick()"><i id="send-icon" class="fa-solid fa-arrow-up"></i></button>
  </div>
  <div class="sig"><div class="pill"><span>Developed by</span><span class="nm" title="Muhammad Shehzal Abbas">Shehzal Abbas</span><span class="role"><i class="fa-solid fa-terminal"></i> DevOps &amp; Software Engineer</span></div></div>
</footer>
</div>
</div>
<div id="ov"><div class="md" id="mdb"></div></div>
<div id="toast"></div>
<script>
/* ============ OWNER CONFIG (edit only this block) ============ */
const CONFIG={
  API_KEY:"",          // Gemini API key (restrict it to your website domain in Google AI Studio)
  PROXY_URL:"",        // Optional: your own server/proxy URL that adds the key. If set, API_KEY is not needed.
  API_KEYS:[],         // Optional: extra Gemini keys. When one hits its free limit, the next one is used automatically.
  GOOGLE_CLIENT_ID:"", // Optional: enables "Continue with Google" (Gmail) - easiest setup, no Firebase needed.
  FREE_CHAT:true,      // true = when the Gemini limit is reached (or there is no key) chat continues through a free service
  FREE_IMAGES:true,    // true = images are generated for free first (no key needed)
  FIREBASE:{apiKey:"",authDomain:"",projectId:"",appId:""}   // Optional: Google / Apple sign-in through Firebase
};
/* =============================================================== */
const API_BASE=CONFIG.PROXY_URL||"https://generativelanguage.googleapis.com/v1beta",DEFAULT_MODEL="gemini-3.5-flash-lite",DEFAULT_IMG="gemini-3.1-flash-image",FIRST_BYTE_TIMEOUT=25000,IDLE_TIMEOUT=30000,MAX_HISTORY=10,FALLBACKS=["gemini-3.1-flash-lite","gemini-3.5-flash"];
const FREE_CHAT=CONFIG.FREE_CHAT!==false,FREE_IMAGES=CONFIG.FREE_IMAGES!==false;

function addUserBubble(text,names,thumbs){const w=document.createElement("div");w.className="m u";w.innerHTML='<div class="bub msg-body" dir="auto"></div>';const b=w.firstChild;(thumbs||[]).forEach(s=>{const i=document.createElement("img");i.className="th";i.src=s;b.appendChild(i)});(names||[]).forEach(n=>{const s=document.createElement("span");s.className="fc";s.innerHTML='<i class="fa-solid fa-paperclip"></i>'+esc(n);b.appendChild(s)});if(text){const d=document.createElement("div");d.textContent=text;b.appendChild(d)}chat.appendChild(w);scrollDown(true)}
function addAiBubble(){const w=document.createElement("div");w.className="m";w.innerHTML='<div class="av"></div><div class="bub"><div class="msg-body" dir="auto"><span class="dots"><span></span><span></span><span></span></span></div><div class="meta"></div></div>';chat.appendChild(w);scrollDown(true);return{body:w.querySelector(".msg-body"),meta:w.querySelector(".meta")}}
function imgEl(i){const d=document.createElement("div");if(i.url){const u=esc(i.url);d.innerHTML='<img class="gen" alt="Generated image" src="'+u+'"><a class="dl" href="'+u+'" target="_blank" rel="noopener" onclick="dlImg(this.href,event)"><i class="fa-solid fa-download"></i> Download</a>';return d}
const src="data:"+i.mime+";base64,"+i.data;d.innerHTML='<img class="gen" alt="Generated image" src="'+src+'"><a class="dl" download="voxora-image.png" href="'+src+'"><i class="fa-solid fa-download"></i> Download</a>';return d}

/* build request contents */
function buildContents(){let ms=cur.msgs.slice(-MAX_HISTORY);while(ms.length&&ms[0].role!=="user")ms.shift();
return ms.map(m=>({role:m.role,parts:(m.parts||[]).concat([{text:m.text||(m.imgs?"[image generated]":"(empty)")}])}))}
function sysText(){return SYSTEM+(mem.length?"\n\nSaved memories about this user (use them when relevant):\n- "+mem.join("\n- "):"")}

/* free services (no key needed) */
function freeImage(prompt,signal){return new Promise((res,rej)=>{const u="https://image.pollinations.ai/prompt/"+encodeURIComponent(prompt.slice(0,800))+"?width=1024&height=1024&nologo=true&model=flux&seed="+Math.floor(Math.random()*1e9);const im=new Image();const t=setTimeout(()=>{im.onload=im.onerror=null;im.src="";rej(new Error("timeout"))},60000);im.onload=()=>{clearTimeout(t);res(u)};im.onerror=()=>{clearTimeout(t);rej(new Error("failed"))};if(signal)signal.addEventListener("abort",()=>{clearTimeout(t);im.onload=im.onerror=null;im.src="";rej(new Error("aborted"))},{once:true});im.src=u})}
function buildFreeMsgs(){let ms=cur.msgs.slice(-MAX_HISTORY);while(ms.length&&ms[0].role!=="user")ms.shift();
return [{role:"system",content:sysText()}].concat(ms.map(m=>{const ps=m.parts||[];let c=ps.map(p=>p.text||"").filter(Boolean).join("\n\n");if(ps.some(p=>p.inline_data))c+="\n[An attached image/PDF could not be read in free mode]";c=(c+"\n\n"+(m.text||(m.imgs&&m.imgs.length?"[image generated]":""))).trim();return{role:m.role==="model"?"assistant":"user",content:c||"(empty)"}}))}
async function freeChat(signal){const r=await fetch("https://text.pollinations.ai/openai",{method:"POST",signal:signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:buildFreeMsgs(),temperature:.3})});
if(!r.ok)throw new Error("The free service is busy ("+r.status+"). Please try again in a moment.");const j=await r.json();return(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||""}
async function dlImg(u,ev){ev.preventDefault();try{const b=await(await fetch(u)).blob();const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="voxora-image.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){window.open(u,"_blank","noopener")}}

/* send flow */
async function sendMessage(){
const text=ta.value.trim();if((!text&&!files.length)||busy)return;
if(!hasG()&&!FREE_CHAT&&!FREE_IMAGES){toast("Voxora is not configured yet. The owner needs to add the API key in the CONFIG block.");return}
if(FORGET_RE.test(text)){mem=[];saveMem();toast("Memory cleared")}else if(MEM_RE.test(text))remember(text);
const wantImg=imgMode||IMG_RE.test(text),att=files;files=[];renderPending();if(imgMode){imgMode=false;$("imb").classList.remove("on")}
const msg={role:"user",text:text,names:att.map(f=>f.name),parts:att.map(f=>f.part),thumbs:att.filter(f=>f.thumb).map(f=>f.thumb)};
$("welcome").style.display="none";addUserBubble(text,msg.names,msg.thumbs);ta.value="";ta.style.height="auto";
cur.msgs.push(msg);if(cur.msgs.length===1){cur.title=(text||msg.names[0]||"New chat").slice(0,40);cur.ts=Date.now();chats.unshift(cur)}renderHist();
const ui=addAiBubble();setBusy(true);controller=new AbortController();const signal=controller.signal;
let timer;const arm=ms=>{clearTimeout(timer);timer=setTimeout(()=>controller.abort("timeout"),ms)};
const t0=performance.now();let tFirst=null,full="",imgs=[],ok=false,raf=null,srcs=[],used=model,grounded=false,tool=wantImg?null:pickTool(text,att);
const paint=fin=>{if(raf&&!fin)return;raf=requestAnimationFrame(()=>{raf=null;ui.body.innerHTML=renderMarkdown(full);imgs.forEach(i=>ui.body.appendChild(imgEl(i)));ui.body.classList.toggle("streaming",!fin);if(fin&&srcs.length){const d=document.createElement("div");d.className="src";d.innerHTML="Sources: "+srcs.slice(0,5).map(x=>'<a target="_blank" rel="noopener" href="'+esc(x.uri)+'">'+esc(x.title)+"</a>").join("");ui.body.appendChild(d)}scrollDown()})};
try{
if(wantImg){arm(150000);let done=false;
if(FREE_IMAGES){for(let a=0;a<2&&!done;a++){try{imgs.push({url:await freeImage(text||"Create an image",signal)});used="free";done=true}catch(e){if(signal.aborted)throw e}}}
if(!done){
if(!hasG())throw new Error("The free image service is busy right now. Please try again in a minute.");
const body=JSON.stringify({contents:[{role:"user",parts:(msg.parts||[]).concat([{text:text||"Create an image"}])}],generationConfig:{responseModalities:["TEXT","IMAGE"]}});
const call=()=>fetch(API_BASE+"/models/"+imgModel+":generateContent",{method:"POST",signal:signal,headers:hdr(),body:body});
const callRot=async()=>{let r;for(let i=0;i<Math.max(1,KEYS.length);i++){r=await call();if(r.status!==429)return r;rotateKey()}return r};
let res=await callRot();
if(res.status===404){const b=await findBest(/^models\/gemini-(\d+(?:\.\d+)?)-flash-image$/,signal)||await findBest(/^models\/gemini-(\d+(?:\.\d+)?)-[a-z0-9.-]*image[a-z0-9.-]*$/,signal);if(b){imgModel=b;localStorage.setItem("vx_img_model",b);res=await callRot()}}
if(!res.ok){const e=await httpError(res);if(res.status===429||res.status===403)e.message+=" Image generation may need a paid API plan.";throw e}
const d=await res.json(),parts=(d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[];
for(const p of parts){const idt=p.inlineData||p.inline_data;if(idt)imgs.push({mime:idt.mimeType||idt.mime_type||"image/png",data:idt.data});else if(p.text&&!p.thought)full+=p.text}
if(!imgs.length&&!full)full=(d.promptFeedback&&d.promptFeedback.blockReason)?"This image request was blocked by the safety filter.":"No image was returned. Please try a different description."}
ok=true;paint(true)}
else{
let useFree=FREE_CHAT&&!hasG(),res=null;
if(!useFree){
const call=(m,t)=>{arm(FIRST_BYTE_TIMEOUT);return fetch(API_BASE+"/models/"+m+":streamGenerateContent?alt=sse",{method:"POST",signal:signal,headers:hdr(),body:JSON.stringify(Object.assign({system_instruction:{parts:[{text:sysText()}]},contents:buildContents(),generationConfig:{temperature:.3,maxOutputTokens:2048}},t?{tools:[t]}:{}))})};
const callRot=async(m,t)=>{let r;for(let i=0;i<Math.max(1,KEYS.length);i++){r=await call(m,t);if(r.status!==429)return r;rotateKey()}return r};
const chain=[model].concat(FALLBACKS.filter(m=>m!==model));
try{
outer:for(const m of chain){for(const t of(tool?[tool,null]:[null])){res=await callRot(m,t);if(res.status!==429){used=m;grounded=!!t;break outer}}}
if(res.status===404){const b=await findBest(/^models\/gemini-(\d+(?:\.\d+)?)-flash-lite$/,signal);if(b&&b!==model){setModel(b);res=await callRot(b,tool);used=b;grounded=!!tool}}
}catch(e){if(signal.aborted||!FREE_CHAT)throw e;useFree=true}
if(!useFree&&!res.ok&&FREE_CHAT&&[401,403,429,500,502,503].includes(res.status))useFree=true}
if(useFree){used="free";grounded=false;arm(60000);full=await freeChat(signal);tFirst=performance.now();if(!full)throw new Error("No response received. Please try again.");ok=true;paint(true)}
else{
if(!res.ok)throw await httpError(res);
const reader=res.body.getReader(),dec=new TextDecoder();let buf="",blocked="";
while(true){const c=await reader.read();if(c.done)break;arm(IDLE_TIMEOUT);buf+=dec.decode(c.value,{stream:true});let i;
while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;const js=line.slice(5).trim();if(!js||js==="[DONE]")continue;let o;try{o=JSON.parse(js)}catch(e){continue}
if(o.error)throw new Error(o.error.message||"API error");if(o.promptFeedback&&o.promptFeedback.blockReason)blocked=o.promptFeedback.blockReason;const gm=o.candidates&&o.candidates[0]&&o.candidates[0].groundingMetadata;if(gm&&gm.groundingChunks)gm.groundingChunks.forEach(c=>{const x=c.web||c.maps;if(x&&/^https?:/.test(x.uri||"")&&!srcs.some(y=>y.uri===x.uri))srcs.push({uri:x.uri,title:x.title||x.uri})});
const parts=o.candidates&&o.candidates[0]&&o.candidates[0].content&&o.candidates[0].content.parts;
if(parts){for(const p of parts){if(p.text&&!p.thought){if(tFirst===null)tFirst=performance.now();full+=p.text}}paint(false)}}}
if(!full)full=blocked?"This request was blocked by the safety filter ("+blocked+").":"No response received. Please try again.";else ok=true;paint(true)}
}
}catch(error){const reason=signal.aborted?signal.reason:null;
if(reason==="user"){full=full?full+"\n\n_(stopped)_":"_(stopped)_";ok=!!full.replace("_(stopped)_","").trim()}
else if(reason==="timeout"){full=(full?full+"\n\n":"")+"Timeout: no response was received. Please check your internet connection and try again."}
else{ui.body.style.color="#fb7185";full="Error: "+error.message}paint(true)
}finally{clearTimeout(timer);setBusy(false);controller=null}
if(ok){const clean=full.replace(/\n\n_\(stopped\)_$/,"");cur.msgs.push({role:"model",text:clean,imgs:imgs});save();const tot=((performance.now()-t0)/1000).toFixed(1);ui.meta.textContent=imgs.length?"Created in "+tot+"s"+(used==="free"?" • Voxora Free":""):"⚡ first word "+(tFirst?((tFirst-t0)/1000).toFixed(1):"-")+"s • total "+tot+"s • "+brand(used)+(grounded?" • verified with "+(tool.googleMaps?"Google Maps":"Google Search"):"")}
else{cur.msgs.pop();if(!cur.msgs.length){chats=chats.filter(c=>c!==cur);renderHist()}}
scrollDown();ta.focus()}
initAuth();
</script>
